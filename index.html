<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christian Bianchi — Frontend Developer</title>
    <meta
      name="description"
      content="Christian Bianchi, frontend developer. Includes a live ascii media converter and a community gallery."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#050505" />

    <!-- Social cards. og:image must stay an absolute URL — scrapers don't
         resolve relative paths. Update the two absolute URLs if the site
         moves to a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Christian Bianchi — Frontend Developer" />
    <meta
      property="og:description"
      content="Christian Bianchi, frontend developer — with a live ascii media converter and community gallery."
    />
    <meta property="og:url" content="https://portfolio-a5n.pages.dev/" />
    <meta property="og:image" content="https://portfolio-a5n.pages.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      href="/fonts/PPNeueMontrealMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Doto (8.7KB) — the About-band display face; preloaded like the main
         face so the band never swaps in late. -->
    <link
      rel="preload"
      href="/fonts/Doto-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
