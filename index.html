<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CHRISTIAN BIANCHI | FRONTEND DEVELOPER</title>
    <meta
      name="description"
      content="Christian Bianchi, frontend developer. Includes a live ascii media converter and a community gallery."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#050505" />

    <!-- Both the apex and www serve the site, so name the apex as canonical
         and keep every crawler pointed at one host. -->
    <link rel="canonical" href="https://christianbianchi.com/" />

    <!-- Social cards. og:image must stay an absolute URL — scrapers don't
         resolve relative paths. Update the two absolute URLs if the site
         moves to a custom domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CHRISTIAN BIANCHI | FRONTEND DEVELOPER" />
    <meta
      property="og:description"
      content="Christian Bianchi, frontend developer — with a live ascii media converter and community gallery."
    />
    <meta property="og:url" content="https://christianbianchi.com/" />
    <meta property="og:image" content="https://christianbianchi.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="preload"
      href="/fonts/PPNeueMontrealMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Doto (8.7KB) — the About-band display face; preloaded like the main
         face so the band never swaps in late. -->
    <link
      rel="preload"
      href="/fonts/Doto-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- TEMPORARY boot diagnostic (2026-08-02). Only runs with ?diag=1, so
         normal visitors never see it. Remove once the mobile blank-page on the
         apex is understood. -->
    <script>
      (function () {
        if (location.search.indexOf("diag") === -1) return;
        var d = document.createElement("div");
        d.setAttribute(
          "style",
          "position:fixed;top:0;left:0;right:0;max-height:45vh;z-index:2147483647;" +
            "padding:14px;margin:0;font:12px/1.45 ui-monospace,Menlo,monospace;" +
            "color:#0f0;background:rgba(0,0,0,.82);pointer-events:none;" +
            "white-space:pre-wrap;word-break:break-all;overflow:auto"
        );
        d.textContent = "1 html parsed + inline script ran";
        document.body.appendChild(d);
        function log(m) {
          d.textContent += "\n" + m;
        }
        window.__diag = log;
        log("host: " + location.host);
        log("path: " + location.pathname);
        log("ua: " + navigator.userAgent);
        window.addEventListener(
          "error",
          function (e) {
            if (e.target && (e.target.src || e.target.href))
              log("RESOURCE FAILED: " + (e.target.src || e.target.href));
            else
              log(
                "ERROR: " + (e.message || "?") + " @ " +
                  (e.filename || "?") + ":" + (e.lineno || "?")
              );
          },
          true
        );
        window.addEventListener("unhandledrejection", function (e) {
          log("PROMISE REJECTED: " + (e.reason && (e.reason.stack || e.reason.message || e.reason)));
        });
        [1000, 3000, 6000, 10000].forEach(function (ms) {
          setTimeout(function () {
            var r = document.getElementById("root");
            var c = document.querySelectorAll("canvas").length;
            log(
              "+" + ms / 1000 + "s root=" +
                (r ? r.childElementCount : "NO ROOT") +
                " canvas=" + c +
                " sheets=" + document.styleSheets.length
            );
          }, ms);
        });
      })();
    </script>
    <script type="module">
      if (window.__diag) window.__diag("2 module scripts execute");
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
