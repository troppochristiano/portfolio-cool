<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The ▙▟ appbar brand mark (BrandLogo.jsx), tile-drawn so it renders
       identically everywhere instead of depending on the tab's glyph font.
       ▙ = upper-left quadrant + lower half; ▟ = upper-right quadrant + lower half. -->
  <rect width="64" height="64" rx="12" fill="#050505"/>
  <g fill="#0000ff">
    <rect x="8" y="20" width="12" height="12"/>
    <rect x="8" y="32" width="24" height="12"/>
    <rect x="44" y="20" width="12" height="12"/>
    <rect x="32" y="32" width="24" height="12"/>
  </g>
</svg>
